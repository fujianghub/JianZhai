<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!--
      简斋 画板 — draw.io 自托管入口（infra/drawio/overrides/index.html，覆盖上游
      src/main/webapp/index.html）。与上游的差别：去掉 draw.io 品牌/SEO 元数据与
      canonical/manifest（商标条款：衍生品不得使用 draw.io 名称与 logo），标题与
      加载文案中文化。脚本引用（bootstrap.js / main.js）与内联样式块与上游一致，
      升级时 diff 上游 index.html 只需关注这两处。无内联 <script>：站点 CSP
      `script-src 'self'` 下直接可用。
    -->
    <title>简斋 · 画板</title>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2b2b2b">
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="stylesheet" type="text/css" href="styles/grapheditor.css">
    <link rel="stylesheet" media="(forced-colors: active)" href="styles/high-contrast.css" id="high-contrast-stylesheet">
    <script src="js/bootstrap.js"></script>
    <style type="text/css">
        .geBlock {
            z-index:-3;
            margin:100px;
            margin-top:40px;
            margin-bottom:30px;
            padding:20px;
            text-align:center;
            min-width:50%;
        }
        .geBlock h1, .geBlock h2 {
            margin-top:0px;
            padding-top:0px;
        }
    </style>
</head>
<body class="geEditor geClassic">
<div id="geInfo">
    <div class="geBlock">
        <h1>简斋 · 画板</h1>
        <h2 id="geStatus">加载中… <img src="images/spin.gif"/></h2>
        <p>请确认浏览器已启用 JavaScript。</p>
    </div>
</div>
<script src="js/main.js"></script>
</body>
</html>
